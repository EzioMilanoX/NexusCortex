[pytest]
# Suíte hermética por PADRÃO: `pytest` roda só os testes rápidos (crew/rede
# mockadas, sem Ollama). O teste de fumaça (marcador 'llm') fica de fora do
# default e é opt-in: `pytest -m llm`.
testpaths = tests
addopts = -q -m "not llm"
markers =
    llm: teste de integração ponta a ponta que exige o Ollama + LLM rodando (lento; pulado se o Ollama estiver offline).
filterwarnings =
    ignore::DeprecationWarning
